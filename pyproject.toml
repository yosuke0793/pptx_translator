[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx-translator"
version = "0.1.0"
description = "PowerPoint translation CLI maintaining layout and formatting"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-pptx",
    "lxml",
    "pydantic>=2.0",
    "pyyaml",
    "pillow",
    "opencv-python-headless",
    "numpy",
]

[project.scripts]
pptx-translator = "pptx_translator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
ignore = ["UP006", "UP035", "FA100", "F841", "E501", "BLE001", "B006", "PLW1510", "S110"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
